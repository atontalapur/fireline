[project]
name = "fireline-pipeline"
version = "0.1.0"
description = "Harmonized MODIS + VIIRS fire cell-day series"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "pyarrow>=17",
  "numpy>=2.0",
  "h3>=4.1",
  "requests>=2.32",
  "matplotlib>=3.9",
  "scipy>=1.14",
  "ruptures>=1.1",
  "google-cloud-storage>=2.18",
  "pystac-client>=0.8",
  "planetary-computer>=1.0",
  "xarray>=2024.9",
  "h5netcdf>=1.4",
  "h5py>=3.16.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
